services:
  - type: web
    name: cultureroute
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt &&
      python -m cultureroute.study_db --build &&
      python -m cultureroute.ingest &&
      python -m cultureroute.pilot_evidence --seed
    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
